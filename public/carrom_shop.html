<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Carrom Board Game Shop</title>
  <style>
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      padding: 0;
      background-color: #0c0805;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      color: #fff;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Currency Header Bar */
    .wallet-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 24px;
      background: #190c05;
      border-bottom: 2px solid #d4af37;
    }

    .shop-brand {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .shop-logo {
      font-size: 24px;
    }
    .shop-title-text h1 {
      margin: 0;
      font-size: 18px;
      color: #ffd700;
      letter-spacing: 0.5px;
    }
    .shop-title-text p {
      margin: 0;
      font-size: 11px;
      color: #bfa57d;
    }

    .currency-group {
      display: flex;
      gap: 12px;
      align-items: center;
    }

    .currency {
      font-weight: bold;
      font-size: 14px;
      background: #2a160b;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid #d4af37;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .coins { color: #ffd700; }
    .gems { color: #00ffff; }

    /* Main Shop Container */
    .shop-container {
      max-width: 1020px;
      width: 95%;
      margin: 20px auto;
      background: #1e1008;
      border: 2px solid #d4af37;
      border-radius: 12px;
      box-shadow: 0 0 35px rgba(0,0,0,0.85);
      overflow: hidden;
      display: flex;
      flex-direction: column;
      flex: 1;
    }

    /* Navigation Tabs */
    .shop-tabs {
      display: flex;
      background: #2a160b;
      border-bottom: 2px solid #d4af37;
      overflow-x: auto;
    }

    .tab-btn {
      flex: 1;
      padding: 14px 10px;
      background: none;
      border: none;
      color: #aaa;
      font-weight: bold;
      font-size: 14px;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.2s;
      white-space: nowrap;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .tab-btn:hover { color: #fff; background: rgba(255, 215, 0, 0.05); }
    .tab-btn.active {
      color: #ffd700;
      background: #3b2010;
      border-bottom: 4px solid #ffd700;
    }

    /* Filter & Search Bar */
    .shop-subbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: #150a04;
      border-bottom: 1px solid #45240f;
      flex-wrap: wrap;
      gap: 10px;
    }

    .search-input {
      background: #251208;
      border: 1px solid #5c3517;
      border-radius: 6px;
      color: #fff;
      padding: 6px 12px;
      font-size: 13px;
      outline: none;
      width: 200px;
    }
    .search-input:focus {
      border-color: #ffd700;
    }

    .rarity-filters {
      display: flex;
      gap: 6px;
      overflow-x: auto;
    }
    .rarity-chip {
      background: #241107;
      border: 1px solid #5c3517;
      color: #8c8279;
      font-size: 11px;
      padding: 4px 10px;
      border-radius: 12px;
      cursor: pointer;
      transition: all 0.15s;
    }
    .rarity-chip:hover { color: #fff; border-color: #d4af37; }
    .rarity-chip.active {
      background: #d4af37;
      color: #000;
      font-weight: bold;
      border-color: #ffd700;
    }

    /* Item Grid */
    .shop-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(210px, 1fr));
      gap: 16px;
      padding: 20px;
      overflow-y: auto;
      flex: 1;
      max-height: 600px;
    }

    /* Item Card */
    .shop-card {
      background: #251208;
      border: 2px solid #5c3517;
      border-radius: 10px;
      padding: 14px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      transition: transform 0.18s ease, border-color 0.18s ease;
    }
    .shop-card:hover {
      transform: translateY(-2px);
      border-color: #bfa57d;
    }

    .shop-card.equipped {
      border-color: #00ffcc;
      box-shadow: 0 0 12px rgba(0, 255, 204, 0.35);
      background: #1b201f;
    }

    .card-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 8px;
    }

    .rarity-tag {
      font-size: 9px;
      font-weight: 800;
      padding: 2px 7px;
      border-radius: 4px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .STANDARD { background: #555; color: #fff; }
    .RARE { background: #1e88e5; color: #fff; }
    .EPIC { background: #8e24aa; color: #fff; }
    .LEGENDARY { background: #ff8f00; color: #000; }
    .MYTHIC { background: #e53935; color: #fff; }

    .item-title {
      font-size: 16px;
      font-weight: bold;
      margin: 4px 0 2px 0;
      color: #fff;
    }
    .item-source {
      font-size: 11px;
      color: #9e8979;
      margin-bottom: 10px;
    }

    /* Visual preview sphere */
    .item-preview-disc {
      width: 58px;
      height: 58px;
      border-radius: 50%;
      margin: 8px auto 12px auto;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 10px rgba(0,0,0,0.6);
      position: relative;
    }

    .stats-bars {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 12px;
      text-align: left;
      background: #190c05;
      padding: 8px;
      border-radius: 6px;
    }
    .stat-row {
      display: flex;
      align-items: center;
      font-size: 10px;
      color: #aaa;
    }
    .stat-name { width: 42px; font-weight: 600; }
    .stat-bar-bg {
      flex: 1;
      height: 5px;
      background: #3a1e0f;
      border-radius: 3px;
      overflow: hidden;
      margin: 0 6px;
    }
    .stat-bar-fill {
      height: 100%;
      background: #ffd700;
      border-radius: 3px;
    }
    .stat-val { width: 14px; text-align: right; color: #fff; font-weight: bold; }

    .item-price {
      font-size: 13px;
      color: #ffd700;
      margin-bottom: 10px;
      font-weight: bold;
    }

    /* Action Buttons */
    .btn {
      width: 100%;
      padding: 9px;
      border: none;
      border-radius: 6px;
      font-weight: bold;
      font-size: 12px;
      cursor: pointer;
      transition: all 0.2s;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .btn-buy { background: #ffd700; color: #000; }
    .btn-buy:hover { background: #ffe135; box-shadow: 0 0 10px rgba(255, 215, 0, 0.4); }
    .btn-equip { background: #00ffcc; color: #000; }
    .btn-equip:hover { background: #33ffd6; box-shadow: 0 0 10px rgba(0, 255, 204, 0.4); }
    .btn-equipped { background: #263832; color: #00ffcc; border: 1px solid #00ffcc; cursor: default; }

    /* Footer Note */
    .shop-footer {
      padding: 12px 24px;
      background: #140903;
      border-top: 1px solid #3d1f0d;
      font-size: 11px;
      color: #9e8979;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }
  </style>
</head>

    </div>

    <div class="shop-subbar">
      <div class="rarity-filters">

        <button class="rarity-chip" onclick="filterRarity('STANDARD')">Standard</button>
        <button class="rarity-chip" onclick="filterRarity('RARE')">Rare</button>
        <button class="rarity-chip" onclick="filterRarity('EPIC')">Epic</button>
        <button class="rarity-chip" onclick="filterRarity('LEGENDARY')">Legendary</button>
        <button class="rarity-chip" onclick="filterRarity('MYTHIC')">Mythic</button>
      </div>
      <input type="text" id="searchInput" class="search-input" placeholder="Search catalog..." oninput="handleSearch(this.value)" />
    </div>

    <div id="shopGrid" class="shop-grid"></div>

    <div class="shop-footer">
      <span>Equipped items apply immediately to your active Carrom board game.</span>
      <span id="loadoutSummary">Loadout: Blaze | Standard | No Trail</span>
    </div>
  </div>

        { id: "puck_enchant", name: "Enchant", rarity: "RARE", source: "Delhi Lounge +", price: { type: "coins", amount: 3500 } },
        { id: "puck_saffron", name: "Saffron", rarity: "RARE", source: "London Park +", price: { type: "coins", amount: 4000 } },
        { id: "puck_surya", name: "Surya", rarity: "RARE", source: "Istanbul Bazaar +", price: { type: "coins", amount: 4500 } },
        { id: "puck_nuke", name: "Nuke", rarity: "RARE", source: "Cairo Gallery +", price: { type: "coins", amount: 5000 } },
        { id: "puck_magma", name: "Magma", rarity: "RARE", source: "Cairo Gallery +", price: { type: "coins", amount: 5000 } },
        { id: "puck_lockdown", name: "Lockdown", rarity: "RARE", source: "Flashback +", price: { type: "coins", amount: 6000 } },
        { id: "puck_stardust", name: "Stardust", rarity: "EPIC", source: "Delhi Lounge +", price: { type: "gems", amount: 45 } },
        { id: "puck_moon", name: "Moon", rarity: "EPIC", source: "London Park +", price: { type: "gems", amount: 50 } },
        { id: "puck_candy", name: "Candy", rarity: "EPIC", source: "Istanbul Bazaar +", price: { type: "gems", amount: 60 } },
        { id: "puck_tron", name: "Tron", rarity: "EPIC", source: "Cairo Gallery +", price: { type: "gems", amount: 75 } },
        { id: "puck_king", name: "King", rarity: "EPIC", source: "Singapore Plaza +", price: { type: "gems", amount: 80 } },
        { id: "puck_neon", name: "Neon", rarity: "EPIC", source: "Singapore Plaza +", price: { type: "gems", amount: 80 } }
      ],
      trails: [
        { id: "trl_none", name: "No Trail", rarity: "STANDARD", source: "Default", price: { type: "coins", amount: 0 } },
        { id: "trl_verdant", name: "Verdant", rarity: "STANDARD", source: "Events", price: { type: "coins", amount: 3000 } },
        { id: "trl_burst", name: "Burst", rarity: "STANDARD", source: "Events", price: { type: "coins", amount: 3000 } },
        { id: "trl_death", name: "Death", rarity: "RARE", source: "Events", price: { type: "coins", amount: 6000 } },
        { id: "trl_slash", name: "Slash", rarity: "RARE", source: "Events", price: { type: "coins", amount: 6000 } },
        { id: "trl_flame", name: "Flame", rarity: "RARE", source: "Events", price: { type: "coins", amount: 6500 } },
        { id: "trl_smash", name: "Smash", rarity: "RARE", source: "Cinema Party +", price: { type: "coins", amount: 7000 } },
        { id: "trl_blueray", name: "BlueRay", rarity: "RARE", source: "Cinema Party +", price: { type: "coins", amount: 7000 } },
        { id: "trl_rainbow", name: "Rainbow", rarity: "EPIC", source: "Flashback +", price: { type: "gems", amount: 75 } },
        { id: "trl_ignis7", name: "Ignis7", rarity: "LEGENDARY", source: "Flashback +", price: { type: "gems", amount: 120 } },
        { id: "trl_cinematic", name: "Cinematic", rarity: "LEGENDARY", source: "Flashback +", price: { type: "gems", amount: 130 } },
        { id: "trl_novachip", name: "Novachip", rarity: "LEGENDARY", source: "Flashback +", price: { type: "gems", amount: 140 } },
        { id: "trl_spotlight", name: "Spotlight", rarity: "LEGENDARY", source: "Flashback +", price: { type: "gems", amount: 140 } },
        { id: "trl_abyss", name: "Abyss", rarity: "LEGENDARY", source: "Flashback +", price: { type: "gems", amount: 150 } }
      ],
      pockets: [
        { id: "pkt_none", name: "No Effect", rarity: "STANDARD", source: "Default", price: { type: "coins", amount: 0 } },
        { id: "pkt_firestarter", name: "Firestarter", rarity: "STANDARD", source: "Shop", price: { type: "gems", amount: 50 } },
        { id: "pkt_jade_echo", name: "Jade Echo", rarity: "RARE", source: "Shop", price: { type: "coins", amount: 12000 } },
        { id: "pkt_mystic", name: "Mystic", rarity: "EPIC", source: "Shop", price: { type: "gems", amount: 90 } },
        { id: "pkt_plasma", name: "Plasma", rarity: "EPIC", source: "Shop", price: { type: "gems", amount: 100 } }
      ]
    };

    // User State Engine synced with Game Economy
    let activeCategory = 'strikers';
    let activeRarity = 'ALL';
    let searchQuery = '';

    function getWallet() {
      try {
        const c = parseInt(localStorage.getItem('chess_master_hub_points') || '50000', 10);
        const g = parseInt(localStorage.getItem('chess_master_hub_gems') || '500', 10);
        return { coins: isNaN(c) ? 50000 : c, gems: isNaN(g) ? 500 : g };
      } catch {
        return { coins: 50000, gems: 500 };
      }
    }

    function saveWallet(coins, gems) {
      try {
        localStorage.setItem('chess_master_hub_points', coins.toString());
        localStorage.setItem('chess_master_hub_gems', gems.toString());
      } catch {}
    }

    function getOwned() {
      try {
        const raw = localStorage.getItem('carrom_shop_owned_items');
        if (raw) return new Set(JSON.parse(raw));
      } catch {}
      return new Set(['str_blaze', 'pwr_blaze', 'puck_black_std', 'puck_white_std', 'trl_none', 'pkt_none']);
    }

    function saveOwned(set) {
      try {
        localStorage.setItem('carrom_shop_owned_items', JSON.stringify(Array.from(set)));
      } catch {}
    }

    function getEquipped() {
      try {
        const raw = localStorage.getItem('carrom_shop_equipped_loadout');
        if (raw) return JSON.parse(raw);
      } catch {}
      return {
        strikers: 'str_blaze',
        powers: 'pwr_blaze',
        pucks: 'puck_black_std',
        trails: 'trl_none',
        pockets: 'pkt_none'
      };
    }

    function saveEquipped(eq) {
      try {
        localStorage.setItem('carrom_shop_equipped_loadout', JSON.stringify(eq));
      } catch {}
    }

    let userWallet = getWallet();
    let ownedItems = getOwned();
    let equippedItems = getEquipped();

    function switchCategory(cat) {
      activeCategory = cat;
      document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.classList.toggle('active', btn.innerText.toLowerCase().includes(cat.slice(0, -1)));
      });
      renderShop();
    }

    function filterRarity(rarity) {
      activeRarity = rarity;
      document.querySelectorAll('.rarity-chip').forEach(chip => {
        chip.classList.toggle('active', chip.innerText.toUpperCase() === rarity);
      });
      renderShop();
    }

    function handleSearch(q) {
      searchQuery = q.trim().toLowerCase();
      renderShop();
    }

    function renderShop() {
      const grid = document.getElementById('shopGrid');
      grid.innerHTML = '';
      let items = (CARROM_SHOP_DATA[activeCategory] || []).filter(item => {
        const matchRarity = activeRarity === 'ALL' || item.rarity === activeRarity;
        const matchSearch = !searchQuery || item.name.toLowerCase().includes(searchQuery) || item.source.toLowerCase().includes(searchQuery);
        return matchRarity && matchSearch;
      });

      if (items.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align: center; color: #888; padding: 40px 0;">No items found matching your filters.</div>`;
      }

      items.forEach(item => {
        const isOwned = ownedItems.has(item.id);
        const isEquipped = equippedItems[activeCategory] === item.id;

        const card = document.createElement('div');
        card.className = `shop-card ${isEquipped ? 'equipped' : ''}`;

        let actionButtonHTML = '';
        if (isEquipped) {
          actionButtonHTML = `<button class="btn btn-equipped" disabled>✓ EQUIPPED</button>`;
        } else if (isOwned) {
          actionButtonHTML = `<button class="btn btn-equip" onclick="equipItem('${item.id}')">EQUIP</button>`;
        } else {
          const costText = `${item.price.amount.toLocaleString()} ${item.price.type.toUpperCase()}`;
          actionButtonHTML = `<button class="btn btn-buy" onclick="buyItem('${item.id}')">BUY (${costText})</button>`;
        }

        // Stats preview if available
        let statsHTML = '';
        if (item.stats) {
          statsHTML = `
            <div class="stats-bars">
              <div class="stat-row">
                <span class="stat-name">Force</span>
                <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${item.stats.force * 10}%; background: #ef4444;"></div></div>
                <span class="stat-val">${item.stats.force}</span>
              </div>
              <div class="stat-row">
                <span class="stat-name">Aim</span>
                <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${item.stats.aim * 10}%; background: #3b82f6;"></div></div>
                <span class="stat-val">${item.stats.aim}</span>
              </div>
              <div class="stat-row">
                <span class="stat-name">Time</span>
                <div class="stat-bar-bg"><div class="stat-bar-fill" style="width: ${item.stats.time * 10}%; background: #10b981;"></div></div>
                <span class="stat-val">${item.stats.time}</span>
              </div>
            </div>
          `;
        }

        const discBg = item.color || '#334155';
        const discBorder = item.rimColor || '#d4af37';

        card.innerHTML = `
          <div>
            <div class="card-top">
              <span class="rarity-tag ${item.rarity}">${item.rarity}</span>
              <span style="font-size: 10px; color: #888;">${item.id.split('_')[0].toUpperCase()}</span>
            </div>
            <div class="item-preview-disc" style="background: ${discBg}; border: 3px solid ${discBorder};">
              <div style="width: 22px; height: 22px; border-radius: 50%; border: 2px solid ${discBorder};"></div>
            </div>
            <div class="item-title">${item.name}</div>
            <div class="item-source">${item.source}</div>
            ${statsHTML}
          </div>
          <div>
            <div class="item-price">${isOwned ? '✓ In Inventory' : (item.price.type === 'coins' ? '🪙 ' : '💎 ') + item.price.amount.toLocaleString() + ' ' + item.price.type}</div>
            ${actionButtonHTML}
          </div>
        `;
        grid.appendChild(card);
      });

      // Update Top UI Counters
      document.getElementById('coinCount').innerText = userWallet.coins.toLocaleString();
      document.getElementById('gemCount').innerText = userWallet.gems.toLocaleString();

      const loadoutText = `Striker: ${(CARROM_SHOP_DATA.strikers.find(s => s.id === equippedItems.strikers) || { name: 'Blaze' }).name} | Puck: ${(CARROM_SHOP_DATA.pucks.find(p => p.id === equippedItems.pucks) || { name: 'Standard' }).name}`;
      document.getElementById('loadoutSummary').innerText = loadoutText;
    }

    function buyItem(itemId) {
      const item = CARROM_SHOP_DATA[activeCategory].find(i => i.id === itemId);
      if (!item) return;

      const currency = item.price.type;
      if (userWallet[currency] >= item.price.amount) {
        userWallet[currency] -= item.price.amount;
        ownedItems.add(itemId);
        saveWallet(userWallet.coins, userWallet.gems);
        saveOwned(ownedItems);
        renderShop();
      } else {
        alert(`Not enough ${currency}! You have ${userWallet[currency]} but need ${item.price.amount}.`);
      }
    }

    function equipItem(itemId) {
      equippedItems[activeCategory] = itemId;
      saveEquipped(equippedItems);
      renderShop();
    }

    renderShop();
  </script>
</body>
