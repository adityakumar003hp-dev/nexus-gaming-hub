    <!-- Preloader Overlay CSS & Animations -->
    <style>
      #preloader-overlay {

        width: 0%;

      .preloader-status-text {

        font-weight: 700;
        color: #fde047;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        margin-top: 4px;
        font-family: monospace;
      }

      @keyframes spin-ring {
        0% { transform: rotate(0deg); }
        100% { transform: rotate(360deg); }
      }

      @keyframes pulse-glow {
        0%, 100% { transform: scale(0.95); opacity: 0.5; }
        50% { transform: scale(1.15); opacity: 0.9; }

      }

    <!-- Fullscreen Chess Pro Preloader Overlay -->

        <div id="preloader-status" class="preloader-status-text">Loading Arena... 0%</div>
      </div>
    </div>

    <!-- Vanilla JS Preloader Hide Script -->
    <script>
      (function() {
        const startTime = Date.now();
        const TOTAL_LOADING_TIME_MS = 5000; // Exact 5.0 seconds splash loading animation

        const fillEl = document.getElementById('preloader-fill');
        const statusEl = document.getElementById('preloader-status');

        const interval = setInterval(() => {
          const elapsed = Date.now() - startTime;
          const pct = Math.min(100, Math.floor((elapsed / TOTAL_LOADING_TIME_MS) * 100));
          if (fillEl) fillEl.style.width = pct + '%';
          if (statusEl) statusEl.textContent = 'Loading Arena... ' + pct + '%';

          if (pct >= 100) {
            clearInterval(interval);
          }
        }, 50);

        function hidePreloader() {
          const preloader = document.getElementById('preloader-overlay');
          if (!preloader || preloader.classList.contains('hidden-overlay')) return;

          const elapsedTime = Date.now() - startTime;
          const remainingDelay = Math.max(0, TOTAL_LOADING_TIME_MS - elapsedTime);

          setTimeout(() => {
            preloader.classList.add('hidden-overlay');
            setTimeout(() => {
              if (preloader && preloader.parentNode) {
                preloader.parentNode.removeChild(preloader);
              }
            }, 1250);
          }, remainingDelay);
        }

        if (document.readyState === 'complete') {
          hidePreloader();
        } else {
          window.addEventListener('load', function() {
            hidePreloader();
          });
          // Fallback timer to ensure preloader hides
          setTimeout(hidePreloader, 6000);
        }

        // Expose global helper for React to call when ready
        window.hideChessProPreloader = hidePreloader;
      })();
    </script>
